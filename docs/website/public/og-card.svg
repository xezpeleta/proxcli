<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter','DejaVu Sans',sans-serif">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3B82F6" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1040" cy="120" r="320" fill="url(#glow)"/>

  <!-- $ prompt chip (matches favicon) -->
  <rect x="80" y="84" width="64" height="64" rx="14" fill="#3B82F6"/>
  <text x="112" y="129" text-anchor="middle" fill="#0F172A" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="40" font-weight="bold">$</text>
  <text x="164" y="124" fill="#64748B" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="24">proxcli</text>

  <!-- wordmark -->
  <text x="76" y="330" fill="#F8FAFC" font-size="132" font-weight="bold" letter-spacing="-3">proxcli</text>

  <!-- tagline -->
  <text x="80" y="388" fill="#3B82F6" font-size="36" font-weight="600">Proxmox VE CLI — for humans &amp; agents</text>

  <!-- description -->
  <text x="80" y="446" fill="#94A3B8" font-size="28">Beautiful tables for humans. Structured JSON for AI agents.</text>

  <!-- install code chip -->
  <rect x="78" y="482" width="540" height="66" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="104" y="524" fill="#3B82F6" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="26">$ uv tool install proxcli</text>

  <!-- footer -->
  <text x="80" y="594" fill="#64748B" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22">github.com/xezpeleta/proxcli  ·  pypi.org/project/proxcli/</text>
</svg>
